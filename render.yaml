services:
  - type: web
    name: brain-tumor-segmentation-3d
    env: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PYTORCH_ENABLE_MPS_FALLBACK
        value: "1"

